# application-local.yml
spring:
  jpa:
    properties:
      use_sql_comments: true
      hibernate:
        format_sql: true
    hibernate:
      ddl-auto: update
  datasource:
    username: ${LOCAL_DB_USERNAME}
    password: ${LOCAL_DB_PASSWORD}
    url: ${LOCAL_DB_URL}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${LOCAL_REDIS_HOST}
      port: ${LOCAL_REDIS_PORT}

swagger:
  server-url: ${LOCAL_SWAGGER_SERVER_URL}

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace

sentry:
  logging:
    enabled: false

# 리그 조회 API에서 X-League-Time-Offset 헤더로 기준 시각을 옮겨 테스트 (prod는 미설정 → 비활성)
league:
  time-offset:
    enabled: true
