# application-develop.yml
spring:
  jpa:
    hibernate:
      ddl-auto: update
  datasource:
    username: ${DEV_DB_USERNAME}
    password: ${DEV_DB_PASSWORD}
    url: ${DEV_DB_URL}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${DEV_REDIS_HOST}
      port: ${DEV_REDIS_PORT}

swagger:
  server-url: ${DEV_SWAGGER_SERVER_URL}

# 리그 조회 API에서 X-League-Time-Offset 헤더로 기준 시각을 옮겨 테스트 (prod는 미설정 → 비활성)
league:
  time-offset:
    enabled: true
